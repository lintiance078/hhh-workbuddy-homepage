name = "hhh-workbuddy-homepage"
compatibility_date = "2024-10-04"
pages_build_output_dir = "public"

# ⚠️ 重要：一旦仓库里存在 wrangler.toml，Cloudflare 构建时会用它
# 覆盖后台面板里配的「环境变量」和「D1 绑定」。
# 所以这两样必须写在本文件里，光在后台点是不生效的。
#
# 改密码：改下面 ADMIN_PASSWORD 的值 → 提交 → 自动重新部署即生效。
# 改了 APP_SECRET 会让所有已登录设备的 token 立刻失效（相当于强制重新登录）。

[vars]
ADMIN_PASSWORD = "Lintianceωworkbuddy"
APP_SECRET = "hR5N69vGn4JJ1F6EMeMipLYxC7x7MwVbGU5a1Dci"

[[d1_databases]]
binding = "DB"
database_name = "hhh-homepage-db"
database_id = "97e4ed42-7716-4e03-b3c8-a2a558e0c809"
